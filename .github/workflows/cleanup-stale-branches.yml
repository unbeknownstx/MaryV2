name: Remove converged stale branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale converged branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branches=(
            "chatgpt/embedding-identity-integrity-20260912"
            "feature/13.4-capability-fabric"
            "integration/13.4-week-convergence"
            "integration/13.5-platform-readiness"
            "integration/13.6-neuro-architecture-convergence"
            "integration/13.7-product-polish-and-innovation"
            "integration/13.8-relational-presence"
            "integration/13.9-native-iphone-product"
            "integration/13.10-stream-cohost"
            "integration/13.11-home-compute-fabric"
            "integration/13.12-sensor-workers"
            "integration/13.13-stream-senses"
            "integration/13.14-character-intelligence-learning"
            "maryv2-13.4-mcp-capability-fabric"
          )
          for branch in "${branches[@]}"; do
            encoded="heads/${branch//\//%2F}"
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/${encoded}" >/dev/null 2>&1; then
              echo "Deleting ${branch}"
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/${encoded}"
            else
              echo "Already absent: ${branch}"
            fi
          done
