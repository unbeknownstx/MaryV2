name: Temporary correction prompt patch

on:
  push:
    branches:
      - retrieval-correction-audit-13-68

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[prompt-patched]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up repository Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install targeted test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Apply exact prompt edit
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("mary/cognition/reasoning.py")
          text = path.read_text(encoding="utf-8")
          old = (
              '"Ground claims. Never invent memories, capabilities, actions, '
              'relationship facts, dates, hidden creator mental states, or off-screen activity. '
          )
          new = (
              '"Ground claims. Prefer represented evidence over memory for the claim it covers; '
              'flag contradictions. If Unbe corrects a claim with evidence already in context, '
              'say the earlier claim was wrong and give the correction. Don\'t hedge a settled '
              'claim for balance; say when evidence is genuinely mixed. Never invent memories, '
              'capabilities, actions, relationship facts, dates, hidden creator mental states, '
              'or off-screen activity. '
          )
          if text.count(old) != 1:
              raise SystemExit(f"expected one prompt anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Verify correction policy and prompt budget
        run: |
          python -m pytest -q \
            tests/cognition/test_correction_prompt_policy.py \
            tests/cognition/test_turn_mind_state.py::test_large_creator_profile_still_keeps_normal_prompt_well_below_ceiling

      - name: Commit verified prompt edit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mary/cognition/reasoning.py
          git diff --cached --quiet && exit 0
          git commit -m "Apply correction evidence prompt policy [prompt-patched]"
          git push origin HEAD:${GITHUB_REF_NAME}
