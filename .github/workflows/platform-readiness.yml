name: MaryV2 platform readiness

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contracts:
    name: ${{ matrix.os }} host contracts (Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.14'
          - os: windows-latest
            python: '3.14'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install deterministic test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Install Windows desktop runtime dependencies
        if: runner.os == 'Windows'
        run: python -m pip install -r requirements-desktop.txt
      - name: Windows Qt desktop import smoke
        if: runner.os == 'Windows'
        run: >-
          python -c "import PySide6; from PySide6 import QtCore, QtGui, QtWidgets;
          print('PySide6', PySide6.__version__); assert QtCore and QtGui and QtWidgets"
      - name: Install macOS desktop runtime dependencies
        if: runner.os == 'macOS'
        run: python -m pip install -r requirements-desktop.txt
      - name: macOS Qt desktop import smoke
        if: runner.os == 'macOS'
        run: >-
          python -c "import PySide6; from PySide6 import QtCore, QtGui, QtWidgets;
          print('PySide6', PySide6.__version__); assert QtCore and QtGui and QtWidgets"
      - name: Repository structure
        run: python -m scripts.verify_repository_structure
      - name: Platform readiness contract
        run: python -m scripts.platform_readiness --strict --json
      - name: Platform readiness tests
        run: >-
          python -m pytest -q
          tests/scripts/test_platform_readiness_13_5.py
          tests/scripts/test_host_platform_parity_13_69.py
          tests/voice/test_macos_local_voice_parity_13_69.py
          tests/desktop/test_macos_safe_renderer_boot_13_6.py
          tests/continuity/test_memory_lab_retrieval_13_6.py

  desktop-build:
    name: Desktop Vite safe-renderer build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Syntax check source and Vite config
        working-directory: desktop
        run: |
          node --check src/main.js
          node --check vite.config.js
      - name: Build transformed production frontend
        working-directory: desktop
        run: npm run build
      - name: Verify safe-renderer output markers
        run: |
          grep -R "3D renderer intentionally disabled" desktop/dist/assets
          grep -R "Desktop frontend did not start" desktop/dist

  macos-desktop-build:
    name: macOS Node 22 desktop build contract
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Check and build the same desktop frontend used on Windows
        working-directory: desktop
        run: |
          npm run check
          npm run build

  iphone-project:
    name: Native iPhone project generation and build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios/MaryV2iOS
        run: xcodegen generate
      - name: Build simulator target
        working-directory: ios/MaryV2iOS
        run: >-
          xcodebuild -project MaryV2iOS.xcodeproj -scheme MaryV2iOS
          -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
