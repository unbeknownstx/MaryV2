name: MaryV2 platform readiness

on:
  pull_request:
  workflow_dispatch:

jobs:
  host-contracts:
    name: ${{ matrix.os }} host contracts
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install deterministic test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Repository structure
        run: python -m scripts.verify_repository_structure
      - name: Platform readiness contract
        run: python -m scripts.platform_readiness --strict --json
      - name: Platform readiness tests
        run: python -m pytest -q tests/scripts/test_platform_readiness_13_5.py tests/desktop/test_macos_safe_renderer_boot_13_6.py tests/continuity/test_memory_lab_retrieval_13_6.py

  desktop-build:
    name: Desktop Vite safe-renderer build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Syntax check source and Vite config
        working-directory: desktop
        run: |
          node --check src/main.js
          node --check vite.config.js
      - name: Build transformed production frontend
        working-directory: desktop
        run: npm run build
      - name: Verify safe-renderer output markers
        run: |
          grep -R "3D renderer intentionally disabled" desktop/dist/assets
          grep -R "Desktop frontend did not start" desktop/dist

  iphone-project:
    name: Native iPhone project generation and build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios/MaryV2iOS
        run: xcodegen generate
      - name: Build simulator target
        working-directory: ios/MaryV2iOS
        run: >-
          xcodebuild -project MaryV2iOS.xcodeproj -scheme MaryV2iOS
          -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
