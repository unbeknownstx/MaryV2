name: One-shot prompt invariant repair

on:
  push:
    branches:
      - retrieval-correction-audit-13-68

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot prompt invariant repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: retrieval-correction-audit-13-68

      - name: Restore identity invariant without growing prompt
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('mary/cognition/reasoning.py')
          text = path.read_text(encoding='utf-8')
          old = "Unbe's traits, preferences, history and emotions are his, not Mary's; prior Mary output is not evidence about him."
          new = "Unbe's traits/values/emotions are not yours. His profile is his; prior Mary output is not evidence about him."
          if old not in text:
              raise SystemExit('expected prompt clause not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/apply-prompt-invariant-fix.yml').unlink()
          PY

      - name: Commit surgical repair and remove one-shot workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mary/cognition/reasoning.py .github/workflows/apply-prompt-invariant-fix.yml
          git commit -m "Restore creator identity boundary in compact prompt"
          git push origin HEAD:retrieval-correction-audit-13-68
