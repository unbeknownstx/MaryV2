name: Temporary retrieval/correction diagnostic

on:
  push:
    branches:
      - retrieval-correction-audit-13-68
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up repository Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-desktop.txt

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0 libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-desktop.txt

      - name: Run full suite and capture output
        id: suite
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m pytest -q 2>&1 | tee full-suite-output.txt
          code=${PIPESTATUS[0]}
          echo "pytest_exit_code=$code" >> full-suite-output.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Upload full-suite output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-correction-full-suite-output
          path: full-suite-output.txt
          if-no-files-found: error

      - name: Preserve suite result
        if: always()
        shell: bash
        run: exit "${{ steps.suite.outputs.exit_code || '1' }}"
