name: Temporary retrieval/correction diagnostic

on:
  push:
    branches:
      - retrieval-correction-audit-13-68
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up repository Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-desktop.txt

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0 libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-desktop.txt

      - name: Run focused tests and capture output
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/cognition/test_turn_mind_state.py::test_large_creator_profile_still_keeps_normal_prompt_well_below_ceiling \
            tests/cognition/test_correction_prompt_policy.py \
            tests/mind/test_response_risk_correction.py \
            tests/tools/test_searxng_provider.py \
            tests/tools/test_search_backends.py 2>&1 | tee focused-test-output.txt
          code=${PIPESTATUS[0]}
          echo "pytest_exit_code=$code" >> focused-test-output.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Upload focused output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-correction-focused-output
          path: focused-test-output.txt
          if-no-files-found: error

      - name: Preserve focused test result
        if: always()
        shell: bash
        run: exit "${{ steps.focused.outputs.exit_code || '1' }}"
