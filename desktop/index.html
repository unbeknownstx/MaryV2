<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MaryV2 — Mary Cosma</title>
  </head>
  <body>
    <main id="app">
      <section class="avatar-pane">
        <canvas id="avatar-canvas"></canvas>
        <div id="avatar-fallback" class="avatar-fallback">
          <div class="fallback-orb"></div>
          <strong>Mary Cosma</strong>
          <span>Place MaryCosma.vrm in desktop/public/models/</span>
        </div>
        <aside id="character-state-card" class="character-state-card" aria-label="Mary live state">
          <div class="character-state-title">MY CHARACTERS</div>
          <div class="character-state-name" id="state-name">Mary</div>
          <dl>
            <div><dt>Continuity</dt><dd id="state-continuity">Persistent</dd></div>
            <div><dt>Relationship</dt><dd id="state-relationship">Loading…</dd></div>
            <div><dt>Memories</dt><dd id="state-memories">0</dd></div>
            <div><dt>Mood</dt><dd id="state-mood">Neutral</dd></div>
            <div><dt>Energy</dt><dd id="state-energy">Calm</dd></div>
            <div><dt>Status</dt><dd id="state-runtime">Connecting</dd></div>
            <div class="state-task-row"><dt>Current task</dt><dd id="state-task">None</dd></div>
          </dl>
        </aside>
        <div class="avatar-status">
          <span id="status-dot" class="status-dot"></span>
          <span id="status-text">Connecting to Mary…</span>
        </div>
      </section>

      <section class="conversation-pane">
        <header>
          <div>
            <h1>Mary</h1>
            <p id="model-label">MaryV2</p>
          </div>
          <div id="thinking" class="thinking hidden">Thinking…</div>
        </header>

        <div id="messages" class="messages" aria-live="polite">
          <article class="message mary">
            <div class="speaker">Mary</div>
            <div class="bubble">I'm here.</div>
          </article>
        </div>

        <form id="composer" class="composer">
          <textarea
            id="message-input"
            rows="2"
            placeholder="Talk to Mary…"
            autocomplete="off"
          ></textarea>
          <button id="mic-button" type="button" aria-pressed="false" title="Push to talk">Mic</button>
          <button id="send-button" type="submit">Send</button>
        </form>
      </section>
    </main>

    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
