[pytest]
# MaryV2 keeps installer payloads/backups and generated frontend/runtime files
# outside the canonical test tree. Ignore them explicitly so a patch unpacked
# inside the repository cannot cause duplicate-module collection errors.
norecursedirs =
    .git
    .venv
    __pycache__
    .pytest_cache
    node_modules
    dist
    build
    payload
    upgrade_backups
    MaryV2_12_9_Uplift_PATCH*
